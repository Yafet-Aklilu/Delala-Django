{% extends 'base.html' %}

{% block content %}
<h2>Upload a Property</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ property_form.as_p }}
    
    <label>Upload Images:</label>
    <input type="file" name="images" multiple>

    <button type="submit">Submit</button>
</form>
{% endblock %}
